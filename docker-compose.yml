services:

  app:

    build: .

    container_name: ai-document-chat-app

    ports:
      - "8501:8501"

    environment:
      OLLAMA_URL: http://ollama:11434

    depends_on:
      - ollama


  ollama:

    image: ollama/ollama

    container_name: ai-document-chat-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama


volumes:

  ollama_data: